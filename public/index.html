<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>치지직</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <a href="#/" class="brand">치지직</a>
    <nav>
      <a href="#/">방송 목록</a>
      <a href="/download">앱 다운로드</a>
      <a href="#/new" class="button secondary">+ 녹화방송 등록</a>
      <a href="#/live/new" class="button live">● 라이브 시작</a>
      <span class="auth-area" data-role="auth-area"></span>
    </nav>
  </header>

  <main id="view" aria-live="polite"></main>

  <!-- 방송 목록: 라이브 방송 + 녹화방송 -->
  <template id="tpl-list">
    <section>
      <h1>라이브 방송</h1>
      <p class="muted" data-role="live-status">불러오는 중…</p>
      <ul class="grid" data-role="live-list"></ul>
    </section>
    <section>
      <h1>녹화방송</h1>
      <p class="muted" data-role="status">불러오는 중…</p>
      <ul class="grid" data-role="list"></ul>
    </section>
  </template>

  <template id="tpl-card">
    <li class="card">
      <a data-role="link">
        <div class="thumb"><span class="badge" data-role="badge"></span>▶</div>
        <div class="card-body">
          <h2 data-role="title"></h2>
          <p class="muted" data-role="date"></p>
        </div>
      </a>
    </li>
  </template>

  <!-- 로그인 / 회원가입 -->
  <template id="tpl-login">
    <section class="narrow">
      <h1>로그인</h1>
      <form data-role="form" novalidate>
        <label>아이디 <input name="username" autocomplete="username" required></label>
        <label>비밀번호 <input name="password" type="password" autocomplete="current-password" required></label>
        <p class="error" data-role="error" hidden></p>
        <button type="submit" class="button">로그인</button>
      </form>
      <p class="muted">아직 회원이 아니신가요? <a data-role="switch">회원가입</a></p>
    </section>
  </template>

  <template id="tpl-signup">
    <section class="narrow">
      <h1>회원가입</h1>
      <form data-role="form" novalidate>
        <label>아이디 <span class="hint">영문 소문자·숫자·_ 3~20자</span>
          <input name="username" autocomplete="username" maxlength="20" required>
        </label>
        <label>비밀번호 <span class="hint">8자 이상</span>
          <input name="password" type="password" autocomplete="new-password" required>
        </label>
        <label>닉네임 <span class="hint">댓글·방송에 표시, 2~20자</span>
          <input name="nickname" maxlength="20" required>
        </label>
        <p class="error" data-role="error" hidden></p>
        <button type="submit" class="button">가입하고 로그인</button>
      </form>
      <p class="muted">이미 회원이신가요? <a data-role="switch">로그인</a></p>
    </section>
  </template>

  <!-- 로그인이 필요한 화면 -->
  <template id="tpl-login-required">
    <section class="narrow">
      <h1 data-role="title"></h1>
      <p>로그인한 회원만 할 수 있습니다.</p>
      <p class="row">
        <a class="button" data-role="login">로그인</a>
        <a class="button secondary" data-role="signup">회원가입</a>
      </p>
    </section>
  </template>

  <!-- 소유자에게만 보이는 관리 영역 (실제 권한 검사는 서버에서) -->
  <template id="tpl-owner-tools">
    <div class="owner-tools">
      <div class="row">
        <button type="button" class="button secondary" data-role="edit">수정</button>
        <button type="button" class="button danger" data-role="delete">삭제</button>
      </div>
      <form data-role="edit-form" hidden>
        <label>제목 <input name="title" maxlength="100" required></label>
        <label data-role="description-field">설명 <textarea name="description" rows="3" maxlength="2000"></textarea></label>
        <div class="row">
          <button type="submit" class="button">저장</button>
          <button type="button" class="button secondary" data-role="cancel">취소</button>
        </div>
      </form>
      <p class="error" data-role="error" hidden></p>
    </div>
  </template>

  <!-- 댓글 -->
  <template id="tpl-comments">
    <section class="comments">
      <h2>댓글 <span class="muted" data-role="count"></span></h2>
      <form data-role="form" novalidate hidden>
        <textarea name="body" rows="2" maxlength="500" placeholder="댓글을 입력하세요 (500자 이하)"></textarea>
        <button type="submit" class="button">등록</button>
      </form>
      <p class="muted" data-role="login-hint" hidden><a data-role="login">로그인</a>하면 댓글을 쓸 수 있습니다.</p>
      <p class="error" data-role="error" hidden></p>
      <ul class="comment-list" data-role="list"></ul>
    </section>
  </template>

  <template id="tpl-comment">
    <li class="comment">
      <div class="comment-head">
        <strong data-role="author"></strong>
        <span class="muted" data-role="date"></span>
        <span class="comment-actions" data-role="actions" hidden>
          <button type="button" class="link" data-role="edit">수정</button>
          <button type="button" class="link" data-role="delete">삭제</button>
        </span>
      </div>
      <p class="comment-body" data-role="body"></p>
      <form data-role="edit-form" hidden>
        <textarea name="body" rows="2" maxlength="500"></textarea>
        <div class="row">
          <button type="submit" class="button">저장</button>
          <button type="button" class="button secondary" data-role="cancel">취소</button>
        </div>
      </form>
    </li>
  </template>

  <!-- 후원: 합계·내역(공개)과 후원하기(회원). 확정은 서버가 결제 승인을 확인한 뒤에만 된다. -->
  <template id="tpl-donations">
    <section class="donations">
      <div class="donation-head">
        <h2>후원</h2>
        <p class="donation-total"><strong data-role="total-amount">0원</strong> <span class="muted" data-role="total-count">0건</span></p>
      </div>
      <form data-role="form" novalidate hidden>
        <div class="row amount-presets" data-role="presets"></div>
        <label>후원 금액 (원) <span class="hint" data-role="amount-hint"></span>
          <input name="amount" type="number" inputmode="numeric" required>
        </label>
        <label>후원 메시지 <span class="hint">선택, 100자 이하</span>
          <input name="message" maxlength="100" placeholder="방송 잘 보고 있어요!">
        </label>
        <button type="submit" class="button donate">♥ 후원하기</button>
        <p class="muted small" data-role="provider-note"></p>
      </form>
      <p class="muted" data-role="note" hidden></p>
      <p class="error" data-role="error" hidden></p>
      <ul class="donation-list" data-role="list"></ul>
    </section>
  </template>

  <template id="tpl-donation-item">
    <li class="donation-item">
      <span class="donation-amount" data-role="amount"></span>
      <strong data-role="donor"></strong>
      <span class="muted" data-role="date"></span>
      <p class="donation-message" data-role="message"></p>
    </li>
  </template>

  <!-- 결제창에서 돌아온 화면 (/donation/success, /donation/fail) -->
  <template id="tpl-donation-result">
    <section class="narrow donation-result">
      <h1 data-role="title">후원 확인 중…</h1>
      <p data-role="message">결제 승인을 서버에서 확인하고 있습니다. 화면을 닫지 마세요.</p>
      <dl class="info" data-role="details" hidden>
        <dt>받는 소유자</dt><dd data-role="recipient"></dd>
        <dt>금액</dt><dd data-role="amount"></dd>
        <dt>메시지</dt><dd data-role="donation-message"></dd>
        <dt>주문번호</dt><dd><code data-role="order-id"></code></dd>
      </dl>
      <div class="mock-tools" data-role="mock-tools" hidden>
        <p class="muted">테스트: 결제 서비스가 같은 승인 통지(웹훅)를 반복해서 보내도 후원이 한 번만 적립되는지 확인합니다.</p>
        <button type="button" class="button secondary" data-role="resend">승인 통지 3번 다시 보내기</button>
        <pre class="mock-log" data-role="resend-log" hidden></pre>
      </div>
      <p class="row"><a class="button" data-role="back" href="/#/">방송으로 돌아가기</a></p>
    </section>
  </template>

  <div class="toast-area" data-role="toasts" aria-live="polite"></div>

  <!-- 녹화방송 상세 + 플레이어 -->
  <template id="tpl-detail">
    <section>
      <p><a href="#/">← 목록으로</a></p>
      <p class="muted" data-role="status">불러오는 중…</p>
      <article data-role="article" hidden>
        <video data-role="player" controls preload="metadata" playsinline></video>
        <p class="error" data-role="player-error" hidden>영상을 재생할 수 없습니다. 영상 위치를 확인해 주세요.</p>
        <h1 data-role="title"></h1>
        <p class="muted" data-role="meta"></p>
        <p class="description" data-role="description"></p>
        <dl class="info">
          <dt>영상 위치</dt>
          <dd><code data-role="location"></code></dd>
        </dl>
        <div data-role="owner-tools"></div>
        <div data-role="donations"></div>
        <div data-role="comments"></div>
      </article>
    </section>
  </template>

  <!-- 녹화방송 등록 -->
  <template id="tpl-new">
    <section class="narrow">
      <h1>녹화방송 등록</h1>
      <form data-role="form" novalidate>
        <label>제목 <span class="req">*</span>
          <input name="title" maxlength="100" required placeholder="예) 11월 4일 정기 방송">
        </label>
        <label>설명
          <textarea name="description" rows="3" maxlength="2000"></textarea>
        </label>

        <fieldset>
          <legend>영상 <span class="req">*</span></legend>
          <label class="inline"><input type="radio" name="source" value="upload" checked> 파일 업로드</label>
          <label class="inline"><input type="radio" name="source" value="url"> 영상 URL 연결</label>

          <div data-source="upload">
            <input type="file" name="videoFile" accept="video/*">
            <p class="muted">mp4/webm 등 브라우저에서 재생 가능한 형식을 권장합니다.</p>
          </div>
          <div data-source="url" hidden>
            <input type="url" name="videoUrl" placeholder="https://example.com/recording.mp4">
            <p class="muted">이미 저장되어 있는 영상 파일의 직접 주소(http/https)를 입력하세요.</p>
          </div>
        </fieldset>

        <progress data-role="progress" max="100" value="0" hidden></progress>
        <p class="error" data-role="error" hidden></p>
        <button type="submit" class="button">등록하기</button>
      </form>
    </section>
  </template>

  <!-- 라이브 송출 (휴대폰) -->
  <template id="tpl-go-live">
    <section class="narrow">
      <h1>라이브 송출</h1>
      <p class="error" data-role="unsupported" hidden>
        이 주소에서는 카메라·마이크를 쓸 수 없습니다. 휴대폰에서는 <strong>https://</strong> 주소로 접속해 주세요.
      </p>
      <div class="stage">
        <video data-role="preview" autoplay muted playsinline></video>
        <span class="live-badge" data-role="on-air" hidden>● 방송 중</span>
      </div>
      <div class="row">
        <button type="button" class="button secondary" data-role="camera">카메라·마이크 켜기</button>
        <button type="button" class="button secondary" data-role="flip" hidden>↻ 카메라 전환</button>
      </div>
      <form data-role="form" novalidate>
        <label>방송 제목 <span class="req">*</span>
          <input name="title" maxlength="100" required placeholder="예) 퇴근길 라이브">
        </label>
        <button type="submit" class="button live" data-role="start" disabled>● 송출 시작</button>
      </form>
      <div data-role="controls" hidden>
        <p><strong data-role="viewers">시청자 0명</strong> · <a data-role="watch-link" target="_blank">시청 화면 열기</a></p>
        <button type="button" class="button danger" data-role="end">■ 송출 종료</button>
      </div>
      <p class="muted" data-role="message"></p>
      <p class="error" data-role="error" hidden></p>
      <div data-role="donations"></div>
      <div data-role="comments"></div>
    </section>
  </template>

  <!-- 라이브 시청 -->
  <template id="tpl-watch-live">
    <section>
      <p><a href="#/">← 목록으로</a></p>
      <p class="muted" data-role="status">불러오는 중…</p>
      <article data-role="article" hidden>
        <div class="stage">
          <video data-role="player" autoplay muted playsinline controls></video>
          <span class="live-badge" data-role="badge"></span>
        </div>
        <div class="row">
          <button type="button" class="button secondary" data-role="unmute">🔊 소리 켜기</button>
          <button type="button" class="button danger" data-role="end" hidden>■ 방송 종료</button>
        </div>
        <h1 data-role="title"></h1>
        <p class="muted" data-role="meta"></p>
        <p class="muted" data-role="message"></p>
        <div data-role="owner-tools"></div>
        <div data-role="donations"></div>
        <div data-role="comments"></div>
      </article>
    </section>
  </template>

  <script src="/app.js" type="module"></script>
</body>
</html>
