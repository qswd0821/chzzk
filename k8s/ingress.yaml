# 클러스터 밖 → Traefik(k3s 기본 인그레스) → chzzk 서비스. WebSocket(/ws/lives)도 그대로 통과한다.
# k3d 설정(k3d-cluster.yaml)이 호스트 8080 을 로드밸런서 80 으로 연결하므로 http://localhost:8080 으로 접속한다.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: chzzk
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: chzzk
                port:
                  name: http
